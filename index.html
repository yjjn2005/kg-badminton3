const PREFIX = "kgp3_";
const GAME_DURATION = 15 * 60; // 15분
const GUEST_LIMIT = 5;

  { id:1, type:"match", label:"코트 1" },
  { id:2, type:"match", label:"코트 2" },

  { id:6, type:"lesson", label:"코트 6 · 레슨" },
];
const GRADE_ORDER = ['A','1A','B','C','D','초심'];
const gradeNum = g => { const i = GRADE_ORDER.indexOf(g); return i<0 ? 5 : i; };

// =========================================================
// localStorage 헬퍼
// =========================================================
const load = (k, d) => {
  try { const v = localStorage.getItem(PREFIX+k); return v ? JSON.parse(v) : d; } catch { return d; }
};
const save = (k, v) => { try { localStorage.setItem(PREFIX+k, JSON.stringify(v)); } catch {} };
const todayStr = () => new Date().toISOString().slice(0,10);

// =========================================================
// 비프음 (v2)
// =========================================================
let audioCtx = null;
const beep = (freq=880, dur=0.15, vol=0.18) => {
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime+0.02);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur+0.05);
  } catch {}
};

// =========================================================
// 매칭 점수 (v1의 100점 알고리즘 + v2 4가지 모드)
// =========================================================
function calcScore(four, todayGames){
  if(!four || four.length !== 4) return 0;
  let s = 0;
  // 1. 급수 분산 (35)
  const grades = four.map(p=>gradeNum(p.grade));
  const avg = grades.reduce((a,b)=>a+b,0)/4;
  const variance = grades.reduce((x,g)=>x+(g-avg)**2,0)/4;
  if(variance < 0.1) s += 35;
  else if(variance < 0.5) s += 28;
  else if(variance < 1.0) s += 19;
  else if(variance < 2.0) s += 10;
  else s += 3;
  // 2. 성비 (20)
  const m = four.filter(p=>p.gender==='남').length;
  const f = 4-m;
  const d = Math.abs(m-f);
  if(d===0) s += 20; else if(d===2) s += 14; else s += 6;
  // 3. 연령대 분산 (20)
  const ys = four.filter(p=>p.year).map(p=>p.year);
  if(ys.length>=2){
    const yA = ys.reduce((a,b)=>a+b,0)/ys.length;
    const yV = ys.reduce((x,y)=>x+(y-yA)**2,0)/ys.length;
    if(yV<6.25) s += 20;
    else if(yV<25) s += 16;
    else if(yV<56) s += 11;
    else if(yV<100) s += 6;
    else s += 2;
  } else s += 14;
  // 4. 게임 수 균등 (15)
  const gms = four.map(p => (todayGames[p.key]||0));
  const aG = gms.reduce((a,b)=>a+b,0)/4;
  if(aG===0) s += 15;
  else if(aG<=1) s += 13;
  else if(aG<=2) s += 9;
  else if(aG<=3) s += 5;
  else s += 2;
  // 5. 대기시간 가중치 (10)
  const maxW = Math.max(0, ...four.map(p=>p.waitedSec||0));
  if(maxW>=30*60) s += 10;
  else if(maxW>=15*60) s += 7;
  else if(maxW>=5*60) s += 4;
  return Math.round(s);
}

const scoreStars = s => s>=85?'★★★★★': s>=70?'★★★★': s>=55?'★★★': s>=40?'★★':'★';

// 조합 nCr (k=4)
function combinations(arr, k){
  if(k > arr.length) return [];
  const out = [];
  const idx = Array.from({length:k},(_,i)=>i);
  const n = arr.length;
  while(true){
    out.push(idx.map(i=>arr[i]));
    let i = k-1;
    while(i>=0 && idx[i] === n - k + i) i--;
    if(i<0) break;
    idx[i]++;
    for(let j=i+1; j<k; j++) idx[j] = idx[j-1]+1;
  }
  return out;
}

// 매칭 모드별 4인 추출 (v2: 공정/균형/혼복/선착순)
function pickFour(queue, mode, todayGames){
  if(queue.length < 4) return null;
  const pool = queue.slice(0, Math.min(12, queue.length)); // 상위 12명
  if(mode==='fifo') return queue.slice(0,4);
  if(mode==='fair'){
    // 게임 횟수 적은 순 + 대기 오래된 순
    const sorted = [...queue].sort((a,b)=>{
      const ga = todayGames[a.key]||0, gb = todayGames[b.key]||0;
      if(ga !== gb) return ga - gb;
      return a.since - b.since;
    });
    return sorted.slice(0,4);
  }
  if(mode==='mixed'){
    // 남2+여2 우선
    const men = queue.filter(p=>p.gender==='남').slice(0,4);
    const women = queue.filter(p=>p.gender==='여').slice(0,4);
    if(men.length>=2 && women.length>=2) return [...men.slice(0,2), ...women.slice(0,2)];
    return queue.slice(0,4);
  }
  if(mode==='balanced' || mode==='smart'){
    // 상위 12명 중 최대 200조합 평가
    const combos = combinations(pool, 4);
    const evals = combos.slice(0, 200).map(c=>({c, s:calcScore(c, todayGames)}));
    evals.sort((a,b)=>b.s-a.s);
    return evals.length ? evals[0].c : null;
  }
  return queue.slice(0,4);
}

// =========================================================
// OCR 매칭 (v1 기반)
// =========================================================
function levenshtein(a, b){
  if(!a || !b) return Math.max(a?.length||0, b?.length||0);
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
  }
  return dp[m][n];
}

function matchTokensToMembers(rawText, members){
  const tokens = rawText
    .replace(/[^가-힣\sa-zA-Z0-9]/g, ' ')
    .split(/\s+/)
    .filter(t => t && /[가-힣]/.test(t) && t.length >= 2 && t.length <= 6)
    .filter((t,i,arr) => arr.indexOf(t) === i);

  const matched = [];
  const unmatched = [];

  tokens.forEach(token => {
    const cleaned = token.replace(/\s/g, '');
    let best = null;
    members.forEach(m => {
      const name = m.name.replace(/\s/g, '');
      if(name === cleaned){ best = { member:m, confidence:1.0 }; return; }
      if(name.includes(cleaned) || cleaned.includes(name)){
        const score = Math.min(name.length, cleaned.length) / Math.max(name.length, cleaned.length);
        if(!best || score > best.confidence) best = { member:m, confidence: score * 0.85 };
        return;
      }
      const dist = levenshtein(name, cleaned);
      const ratio = 1 - dist / Math.max(name.length, cleaned.length);
      if(ratio >= 0.65 && (!best || ratio > best.confidence)){
        best = { member:m, confidence: ratio * 0.75 };
      }
    });
    if(best && best.confidence >= 0.5){
      if(!matched.find(x => x.member.no === best.member.no)){
        matched.push({ ...best, source: token });
      }
    } else unmatched.push(token);
  });
  matched.sort((a,b) => b.confidence - a.confidence);
  return { matched, unmatched };
}

  const [history, setHistory] = useState(()=> load('history', []));
  const [nextGameNo, setNextGameNo] = useState(()=> load('nextGameNo', 1));
  const [guestSeq, setGuestSeq] = useState(()=> load('guestSeq', 1));
  const [mode, setMode] = useState(()=> load('mode', 'smart')); // smart=balanced+age
  const [now, setNow] = useState(Date.now());
  const [toast, setToast] = useState(null);
  const [date, setDate] = useState(()=> load('date', todayStr()));
  const [resetOpen, setResetOpen] = useState(false);

  // 매일 자정 리셋
  useEffect(()=>{
    const t = todayStr();
    if(t !== date){
      setQueue([]); setCourts(COURTS.map(c=>({...c, players:[], startedAt:null, endsAt:null, gameNo:0})));
      setHistory([]); setNextGameNo(1); setGuestSeq(1); setDate(t);
    }
  }, []);

  // tick (1초)
  useEffect(()=>{
    const t = setInterval(()=> setNow(Date.now()), 1000);
    return ()=> clearInterval(t);
  },[]);

  // 카운트다운 비프
  const prevRemain = useRef({});
  useEffect(()=>{
    courts.forEach(c=>{
      if(!c.endsAt) return;
      const remain = Math.floor((c.endsAt - now)/1000);
      const prev = prevRemain.current[c.id];
      if(prev === undefined){ prevRemain.current[c.id] = remain; return; }
      if(prev > 60 && remain <= 60 && remain > 55) beep(880, 0.15, 0.18);
      if(prev > 0 && remain <= 0 && remain > -3) beep(660, 0.4, 0.22);
      prevRemain.current[c.id] = remain;
    });
  }, [now, courts]);

  // 저장
  useEffect(()=> save('members', members), [members]);
  useEffect(()=> save('deleted', deleted), [deleted]);
  useEffect(()=> save('queue', queue), [queue]);
  useEffect(()=> save('courts', courts), [courts]);
  useEffect(()=> save('history', history), [history]);
  useEffect(()=> save('nextGameNo', nextGameNo), [nextGameNo]);
  useEffect(()=> save('guestSeq', guestSeq), [guestSeq]);
  useEffect(()=> save('mode', mode), [mode]);
  useEffect(()=> save('date', date), [date]);

  const showToast = (msg, t=2500) => { setToast(msg); setTimeout(()=>setToast(null), t); };

  // 오늘 게임 수 카운트 (key 기반)
  const todayGames = useMemo(()=>{
    const m = {};
    history.forEach(g => g.players.forEach(p => { m[p.key] = (m[p.key]||0) + 1; }));
    return m;
  }, [history]);

  // 활성 회원 (삭제되지 않은 회원)
  const activeMembers = useMemo(()=> members.filter(m => !deleted.includes(m.no)), [members, deleted]);

  // 게스트 카운트 (오늘)
  const guestCountToday = queue.filter(q=>q.isGuest).length + history.flatMap(g=>g.players).filter(p=>p.isGuest).length;

  // 대기열에 추가
  const addToQueue = (m) => {
    // 중복 체크
    if(queue.some(q=>q.key === m.key)) { showToast(`${m.name}님은 이미 대기 중입니다.`); return false; }
    // 게임 진행 중 체크
    if(courts.some(c=>c.players.some(p=>p.key===m.key))){ showToast(`${m.name}님은 코트에서 경기 중입니다.`); return false; }
    setQueue(q => [...q, { ...m, since: Date.now(), isReturnee: false }]);
    showToast(`✓ ${m.name}님 입장`);
    return true;
  };

  // 대기열에서 제거
  const removeFromQueue = (key) => setQueue(q => q.filter(p => p.key !== key));

  // 매칭 실행 → 코트 배정
  const matchToCourt = (courtId) => {
    const court = courts.find(c=>c.id===courtId);
    if(!court || court.type!=='match') { showToast('일반 매칭 코트(1~4)에만 배정 가능합니다.'); return; }
    if(court.players.length>0) { showToast('이미 경기 중입니다.'); return; }
    const qWithWait = queue.map(p=>({...p, waitedSec: Math.floor((Date.now()-p.since)/1000)}));
    const four = pickFour(qWithWait, mode, todayGames);
    if(!four || four.length<4){ showToast('대기열에 4명 이상 필요합니다.'); return; }
    const startedAt = Date.now();
    const endsAt = startedAt + GAME_DURATION*1000;
    const gameNo = nextGameNo;
    setCourts(cs => cs.map(c => c.id===courtId ? { ...c, players:four, startedAt, endsAt, gameNo } : c));
    setQueue(q => q.filter(p => !four.some(f=>f.key===p.key)));
    setNextGameNo(n=>n+1);
    showToast(`코트 ${courtId}에 ${four.map(p=>p.name).join(', ')} 배정`);
  };

  // 경기 종료
  const endGame = (courtId) => {
    const c = courts.find(x=>x.id===courtId);
    if(!c || c.players.length===0) return;
    // 히스토리 기록
    setHistory(h => [{
      gameNo: c.gameNo, courtId, players: c.players,
      startedAt: c.startedAt, endedAt: Date.now(), score: calcScore(c.players, todayGames)
    }, ...h].slice(0, 200));
    setCourts(cs => cs.map(x => x.id===courtId ? {...x, players:[], startedAt:null, endsAt:null, gameNo:0} : x));
    showToast(`코트 ${courtId} 경기 종료`);
  };

  // 게임 시간 연장 (+5분)
  const extendCourt = (courtId, addMin=5) => {
    setCourts(cs => cs.map(c => {
      if(c.id !== courtId || !c.endsAt) return c;
      return { ...c, endsAt: c.endsAt + addMin*60*1000 };
    }));
    showToast(`코트 ${courtId} +${addMin}분 연장`);
  };

  // 코트에서 큐로 (선수 빼기)
  const courtToQueue = (courtId) => {
    const c = courts.find(x=>x.id===courtId);
    if(!c) return;
    setQueue(q => [...q, ...c.players.map(p=>({...p, since: Date.now(), isReturnee:true}))]);
    setCourts(cs => cs.map(x => x.id===courtId ? {...x, players:[], startedAt:null, endsAt:null, gameNo:0} : x));
  };

  // 코트 타입 변경 (난타/레슨/일반 전환)
  const cycleCourtType = (courtId) => {
    setCourts(cs => cs.map(x => {
      if(x.id !== courtId) return x;
      if(x.players.length>0) { showToast('진행 중인 경기를 먼저 종료하세요.'); return x; }
      const order = ['match','drill','lesson'];
      const next = order[(order.indexOf(x.type)+1) % 3];
      return { ...x, type: next, label: COURTS.find(c=>c.id===courtId).label.replace(/·.*$/, (next==='match'?'':`· ${next==='drill'?'자유난타':'레슨'}`)).trim() || `코트 ${courtId}` };
    }));
  };

  // 게스트 등록
  const addGuest = (name, gender, grade) => {
    if(guestCountToday >= GUEST_LIMIT){ showToast(`게스트는 하루 ${GUEST_LIMIT}명까지만 가능합니다.`); return; }
    const g = {
      no: -guestSeq, name: name || `게스트${guestSeq}`, gender, age:35, year:1990, grade,
      isGuest: true, key: `G${guestSeq}`
    };
    setGuestSeq(s=>s+1);
    addToQueue(g);
  };

  // 회원 입장 (개별)
  const checkIn = (m) => addToQueue({ ...m, key: `M${m.no}`, isGuest:false });

  // 사진 OCR로 인식된 회원 일괄 적용 (대기열 추가 + 빈 매칭 코트 자동 채우기)
  const applyPhotoMembers = (selectedMembers) => {
    const inUseKeys = new Set([
      ...queue.map(q=>q.key),
      ...courts.flatMap(c=>c.players.map(p=>p.key)),
    ]);
    const fresh = selectedMembers
      .map(m => ({ ...m, key:`M${m.no}`, isGuest:false }))
      .filter(m => !inUseKeys.has(m.key));
    if(fresh.length === 0){ showToast('모든 회원이 이미 참여 중입니다.'); return; }

    // 대기열에 일단 추가 (since=now)
    const enriched = fresh.map(m => ({ ...m, since: Date.now(), isReturnee:false }));
    setQueue(q => [...q, ...enriched]);

    // 빈 매칭 코트에 4명씩 자동 배정 (현재 mode로 점수 평가)
    setCourts(cs => {
      const newCourts = [...cs];
      let pool = [...queue, ...enriched].map(p=>({...p, waitedSec: Math.floor((Date.now()-p.since)/1000)}));
      let gameNoCounter = nextGameNo;
      newCourts.forEach((c, idx) => {
        if(c.type !== 'match' || c.players.length>0) return;
        if(pool.length < 4) return;
        const four = pickFour(pool, mode, todayGames);
        if(!four || four.length < 4) return;
        const startedAt = Date.now();
        newCourts[idx] = { ...c, players:four, startedAt, endsAt: startedAt + GAME_DURATION*1000, gameNo: gameNoCounter++ };
        pool = pool.filter(p => !four.some(f=>f.key===p.key));
      });
      setNextGameNo(gameNoCounter);
      // 큐도 동기화
      setQueue(pool.map(({waitedSec,...rest})=>rest));
      return newCourts;
    });
    showToast(`사진 시뮬레이션 적용: ${fresh.length}명 입장, 빈 코트 자동 배정 완료`);
  };

  // ===== 리셋 핸들러 =====
  const resetQueue = () => {
    if(!confirm(`대기열 ${queue.length}명을 모두 비우시겠습니까?\n(코트의 진행중 게임은 유지됩니다)`)) return;

    setResetOpen(false);

    if(!confirm(`진행중 게임 ${running}건을 모두 종료(기록 없이)하고 코트를 비우시겠습니까?`)) return;
    setCourts(COURTS.map(c=>({...c, players:[], startedAt:null, endsAt:null, gameNo:0})));
    showToast('코트 초기화 완료');
    setResetOpen(false);
  };
  const resetToday = () => {
    if(!confirm(`오늘 데이터 전체를 초기화합니다.\n• 대기열 ${queue.length}명\n• 진행 ${courts.filter(c=>c.players.length>0).length}코트\n• 기록 ${history.length}게임\n• 게스트 카운트\n\n계속하시겠습니까?`)) return;

    setCourts(COURTS.map(c=>({...c, players:[], startedAt:null, endsAt:null, gameNo:0})));

    showToast('오늘 데이터 초기화 완료');

    location.reload();
  };

  // 드래그앤드롭 Override (2인 강제결합 등)
  const onDropOnCourt = (courtId, draggedKeys) => {
    const c = courts.find(x=>x.id===courtId);
    if(!c || c.type !== 'match'){ showToast('일반 매칭 코트에만 배정 가능합니다.'); return; }
    if(c.players.length>0){ showToast('이미 경기 중입니다.'); return; }
    const picked = queue.filter(p => draggedKeys.includes(p.key));
    if(picked.length !== 4){ showToast(`정확히 4명을 선택해 드롭하세요. (현재 ${picked.length}명)`); return; }
    const startedAt = Date.now(), endsAt = startedAt + GAME_DURATION*1000;
    setCourts(cs => cs.map(x => x.id===courtId ? {...x, players:picked, startedAt, endsAt, gameNo:nextGameNo} : x));
    setQueue(q => q.filter(p => !draggedKeys.includes(p.key)));
    setNextGameNo(n=>n+1);
    showToast(`강제 배정 완료: ${picked.map(p=>p.name).join(', ')}`);
  };

  return (
    <div className="min-h-screen">
      <Header tab={tab} setTab={setTab} stats={{queue:queue.length, running:courts.filter(c=>c.players.length>0).length, done:history.length, guests:guestCountToday}} onOpenReset={()=>setResetOpen(true)} />
      <main className="max-w-7xl mx-auto px-3 sm:px-5 pb-24 pt-4">
        {tab==='main' && <MainView
          courts={courts} queue={queue} now={now}
          mode={mode} setMode={setMode}
          matchToCourt={matchToCourt} endGame={endGame} courtToQueue={courtToQueue}
          cycleCourtType={cycleCourtType} extendCourt={extendCourt}
          removeFromQueue={removeFromQueue} onDropOnCourt={onDropOnCourt}
          showToast={showToast} todayGames={todayGames}
        />}
        {tab==='intake' && <IntakeView
          activeMembers={activeMembers} checkIn={checkIn} addGuest={addGuest}
          guestCountToday={guestCountToday} showToast={showToast}
        />}
        {tab==='photo' && <PhotoSimView
          activeMembers={activeMembers}
          applyPhotoMembers={applyPhotoMembers}
          showToast={showToast}
        />}
        {tab==='members' && <MembersView
          members={members} setMembers={setMembers}
          deleted={deleted} setDeleted={setDeleted}
          queue={queue} courts={courts} checkIn={checkIn}
        />}
        {tab==='stats' && <StatsView history={history} courts={courts} queue={queue} todayGames={todayGames} activeMembers={activeMembers}/>}
        {tab==='guide' && <GuideView/>}
      </main>
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 glass luxury-shadow px-5 py-3 rounded-2xl text-sm font-semibold z-50">
          {toast}
        </div>
      )}
      {resetOpen && (
        <ResetModal
          stats={{queue:queue.length, running:courts.filter(c=>c.players.length>0).length, history:history.length}}
          onQueue={resetQueue} onCourts={resetCourts} onToday={resetToday} onAll={resetAll}
          onClose={()=>setResetOpen(false)}
        />
      )}
      <footer className="text-center text-xs text-[#7E8AA0] py-6">
        KG 배드민턴 PRO v3 · v1+v2 통합 · localStorage 단독 동작 · © 2026 KG 클럽
      </footer>
    </div>
  );
}

function CourtCard({c, now, onStart, onEnd, onReturn, onCycle, onExtend, onAssignSelected}){
  const diffSec = c.endsAt ? Math.floor((c.endsAt - now)/1000) : 0;
  const remainSec = Math.max(0, diffSec);
  const overSec = diffSec < 0 ? -diffSec : 0;
  const urgent = c.endsAt && diffSec <= 60 && diffSec > 0;
  const over = c.endsAt && diffSec <= 0;
  const running = c.players.length>0;
  const mm = String(Math.floor(remainSec/60)).padStart(2,'0');
  const ss = String(remainSec%60).padStart(2,'0');
  const omm = String(Math.floor(overSec/60)).padStart(2,'0');
  const oss = String(overSec%60).padStart(2,'0');

  return (
    <div className={`court-card luxury-shadow rounded-2xl p-3 ${c.type} ${running?'running':''} ${urgent||over?'urgent':''}`}>
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2">
          <span className="text-base font-black">{c.label}</span>
          {c.type==='match' && <span className="chip chip-A">일반</span>}
          {c.type==='drill' && <span className="chip" style={{background:'rgba(91,226,217,0.18)', color:'#5BE2D9'}}>난타</span>}
          {c.type==='lesson' && <span className="chip" style={{background:'rgba(181,156,255,0.18)', color:'#B59CFF'}}>레슨</span>}
        </div>
        <button onClick={onCycle} className="text-[#9CA3B8] hover:text-amber-400" title="코트 타입 전환">{Icon.cog}</button>
      </div>

      <div className="min-h-[88px]">
        {running ? (
          <>
            <ul className="grid grid-cols-2 gap-1 mb-2">
              {c.players.map(p=>(
                <li key={p.key} className="text-xs px-2 py-1 rounded-lg bg-[rgba(7,15,28,0.5)]">
                  <span className="font-bold">{p.name}</span>{p.isReturnee && <span className="ret-star ml-1">★</span>}
                  <span className="text-[#9CA3B8] ml-1">{p.gender} {p.grade}</span>
                </li>
              ))}
            </ul>
            {c.type==='match' && (
              over ? (
                <div className="text-center">
                  <div className="text-[10px] text-red-400 font-bold">⏱ 초과</div>
                  <div className="text-2xl font-black tabular-nums text-red-400">+{omm}:{oss}</div>
                </div>
              ) : (
                <div className={`text-center text-2xl font-black tabular-nums ${urgent?'text-red-400':remainSec<=180?'gold-text':''}`}>{mm}:{ss}</div>
              )
            )}
          </>
        ) : (
          <div className="text-center py-4 text-sm text-[#9CA3B8]">비어 있음</div>
        )}
      </div>

      <div className="flex gap-1.5 mt-2">
        {c.type==='match' && !running && (
          <button onClick={onStart} className="btn-gold rounded-lg px-3 py-2 text-xs flex-1 flex items-center justify-center gap-1">{Icon.play}자동 매칭</button>
        )}
        {onAssignSelected && c.type==='match' && !running && (
          <button onClick={onAssignSelected} className="btn-ghost rounded-lg px-3 py-2 text-xs flex-1">선택4명 강제배정</button>
        )}
        {running && (
          <>
            <button onClick={onEnd} className="btn-gold rounded-lg px-3 py-2 text-xs flex-1 flex items-center justify-center gap-1">{Icon.stop}종료</button>
            {c.type==='match' && onExtend && (
              <button onClick={onExtend} className="btn-ghost rounded-lg px-2.5 py-2 text-xs font-bold" title="5분 연장">+5분</button>
            )}
            <button onClick={onReturn} className="btn-ghost rounded-lg px-3 py-2 text-xs">대기열로</button>
          </>
        )}
      </div>
    </div>
  );
}

// =========================================================
// 도착인증 (QR 스캔 + 수동 검색)
// =========================================================
function IntakeView({activeMembers, checkIn, addGuest, guestCountToday, showToast}){
  const [search, setSearch] = useState('');
  const [scannerOn, setScannerOn] = useState(false);
  const scannerRef = useRef(null);
  const html5Ref = useRef(null);

  // QR 스캔
  useEffect(()=>{
    if(scannerOn){
      const id = "qr-scanner-region";
      if(!document.getElementById(id)) return;
      try {
        const q = new Html5Qrcode(id);
        html5Ref.current = q;
        q.start({facingMode:"environment"}, {fps:10, qrbox:{width:240, height:240}},
          (decoded)=>{
            const m = decoded.match(/KG3:(\d+)/) || decoded.match(/KGBM:(\d+)/);
            if(m){
              const no = parseInt(m[1],10);
              const mem = activeMembers.find(x=>x.no===no);
              if(mem){
                checkIn(mem);
                q.pause();
                setTimeout(()=>{ try{ q.resume(); }catch{} }, 1500);
              } else showToast('등록되지 않은 회원입니다.');
            }
          },
          ()=>{}
        ).catch(e => showToast('카메라 권한이 필요합니다.'));
      } catch(e){ showToast('스캐너 시작 실패'); }
      return ()=>{
        try { if(html5Ref.current){ html5Ref.current.stop().then(()=>html5Ref.current.clear()); html5Ref.current=null; } } catch {}
      };
    }
  }, [scannerOn]);

  const filtered = useMemo(()=>{
    const s = search.trim();
    if(!s) return activeMembers;
    return activeMembers.filter(m => m.name.includes(s) || String(m.no).includes(s));
  }, [search, activeMembers]);

  return (
    <div className="grid md:grid-cols-2 gap-4">
      <div className="glass luxury-shadow rounded-2xl p-4">
        <h3 className="font-black gold-text mb-3 flex items-center gap-2">{Icon.qr}<span>QR 도착인증</span></h3>
        {!scannerOn ? (
          <div className="text-center py-8">
            <p className="text-sm text-[#CFC6B0] mb-4">회원증 QR을 카메라로 비추세요.<br/>(KG3:번호 형식 자동 인식)</p>
            <button onClick={()=>setScannerOn(true)} className="btn-gold rounded-xl px-6 py-3 font-bold">스캐너 시작</button>
          </div>
        ) : (
          <>
            <div id="qr-scanner-region" ref={scannerRef} style={{width:'100%', maxWidth:340, margin:'0 auto'}}></div>
            <button onClick={()=>setScannerOn(false)} className="btn-ghost rounded-xl px-4 py-2 mt-3 w-full">스캐너 중지</button>
          </>
        )}
      </div>

      <div className="glass luxury-shadow rounded-2xl p-4">
        <h3 className="font-black gold-text mb-3 flex items-center gap-2">{Icon.users}<span>수동 입장</span></h3>
        <input type="text" placeholder="이름 또는 번호 검색" value={search} onChange={e=>setSearch(e.target.value)} className="input mb-3"/>
        <div className="max-h-[300px] overflow-auto space-y-1.5">
          {filtered.map(m=>(
            <button key={m.no} onClick={()=>checkIn(m)} className="w-full text-left p-2 rounded-lg hover:bg-amber-500/10 flex items-center justify-between border border-transparent hover:border-amber-500/30">
              <span className="text-sm"><b>{m.no}</b>. {m.name}</span>
              <span className="flex gap-1"><span className={`chip chip-${m.gender}`}>{m.gender}</span><span className={`chip chip-${m.grade}`}>{m.grade}</span></span>
            </button>
          ))}
          {filtered.length===0 && <div className="text-center text-[#9CA3B8] py-6 text-sm">검색 결과 없음</div>}
        </div>
        <GuestForm onAdd={addGuest} count={guestCountToday}/>
      </div>
    </div>
  );
}

// =========================================================
// 회원관리 (CRUD + QR 출력 + 출석체크)
// =========================================================
function MembersView({members, setMembers, deleted, setDeleted, queue, courts, checkIn}){
  const [editing, setEditing] = useState(null); // member or null
  const [search, setSearch] = useState('');
  const [qrFor, setQrFor] = useState(null);
  const [filter, setFilter] = useState('all'); // all | idle | waiting | playing

  // 회원별 상태 계산
  const statusOf = useCallback((no) => {
    const key = `M${no}`;
    if(queue.some(q => q.key === key)) return 'waiting';
    if(courts.some(c => c.players.some(p => p.key === key))) return 'playing';
    return 'idle';
  }, [queue, courts]);

  const visible = useMemo(()=>{
    const s = search.trim();
    return members.filter(m => !deleted.includes(m.no))
      .filter(m => !s || m.name.includes(s) || String(m.no).includes(s))
      .filter(m => filter==='all' || statusOf(m.no) === filter)
      .sort((a,b)=>a.no - b.no);
  }, [members, deleted, search, filter, statusOf]);

  const counts = useMemo(()=>{
    const active = members.filter(m=>!deleted.includes(m.no));
    let waiting=0, playing=0, idle=0;
    active.forEach(m=>{
      const s = statusOf(m.no);
      if(s==='waiting') waiting++;
      else if(s==='playing') playing++;
      else idle++;
    });
    return { all: active.length, idle, waiting, playing };
  }, [members, deleted, statusOf]);

  const save = (m) => {
    if(editing && editing.no){
      setMembers(ms => ms.map(x => x.no===m.no ? m : x));
    } else {
      const maxNo = Math.max(0, ...members.map(x=>x.no));
      setMembers(ms => [...ms, {...m, no:maxNo+1}]);
    }
    setEditing(null);
  };
  const remove = (no) => {
    if(!confirm('이 회원을 삭제하시겠습니까?')) return;
    setDeleted(d => [...d, no]);
  };

  // 다중선택 출석체크
  const [selectedNos, setSelectedNos] = useState(new Set());
  const toggleRow = (no) => setSelectedNos(s => { const n = new Set(s); n.has(no)? n.delete(no): n.add(no); return n; });
  const selectAllVisibleIdle = () => {
    const ids = visible.filter(m => statusOf(m.no)==='idle').map(m=>m.no);
    setSelectedNos(new Set(ids));
  };
  const bulkCheckIn = () => {
    let count = 0;
    [...selectedNos].forEach(no => {
      const m = members.find(x=>x.no===no);
      if(m && statusOf(no)==='idle'){ checkIn(m); count++; }
    });
    setSelectedNos(new Set());
  };

  const filterChips = [
    { id:'all', label:`전체 ${counts.all}` },
    { id:'idle', label:`미출석 ${counts.idle}` },

function StatsView({history, courts, queue, todayGames, activeMembers}){
  const usage = courts.filter(c=>c.players.length>0).length;
  const usageRate = Math.round(usage / courts.length * 100);

  // TOP5 (오늘 게임 많이 친 회원)
  const top5 = useMemo(()=>{
    const arr = Object.entries(todayGames).map(([key, count])=>{
      const player = history.flatMap(h=>h.players).find(p=>p.key===key) || queue.find(p=>p.key===key);
      return { key, name: player?.name||'?', count, grade:player?.grade||'-' };
    });
    return arr.sort((a,b)=>b.count-a.count).slice(0,5);
  }, [todayGames, history, queue]);

  // 성별/급수별 분포 (대기열 + 진행중)
  const onSite = [...queue, ...courts.flatMap(c=>c.players)];
  const byGender = onSite.reduce((a,p)=>{ a[p.gender]=(a[p.gender]||0)+1; return a; }, {});
  const byGrade = onSite.reduce((a,p)=>{ a[p.grade]=(a[p.grade]||0)+1; return a; }, {});

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="코트 가동률" value={`${usageRate}%`} sub={`${usage}/${courts.length} 진행`}/>
        <Stat label="오늘 완료" value={history.length} sub="누적 게임 수"/>
        <Stat label="현장 인원" value={onSite.length} sub={`회원 ${activeMembers.length}명`}/>
        <Stat label="대기 평균분" value={queue.length ? Math.round(queue.reduce((s,p)=>s+Math.floor((Date.now()-p.since)/60000),0)/queue.length) : 0} sub="분"/>
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        <div className="glass luxury-shadow rounded-2xl p-4">
          <h3 className="font-black gold-text mb-3 flex items-center gap-2">{Icon.star}<span>TOP 5 (오늘 게임 수)</span></h3>
          {top5.length===0 ? <div className="text-[#9CA3B8] text-sm py-4 text-center">아직 게임 기록 없음</div> :
            <ul className="space-y-2">
              {top5.map((p,i)=>(
                <li key={p.key} className="flex items-center justify-between p-2 rounded-lg bg-[rgba(7,15,28,0.4)]">
                  <span className="flex items-center gap-2">
                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${i===0?'btn-gold':'bg-[#2C4F7E]'}`}>{i+1}</span>
                    <b>{p.name}</b><span className={`chip chip-${p.grade}`}>{p.grade}</span>
                  </span>
                  <b className="gold-text">{p.count}게임</b>
                </li>
              ))}
            </ul>
          }
        </div>

        <div className="glass luxury-shadow rounded-2xl p-4">
          <h3 className="font-black gold-text mb-3">현장 분포</h3>
          <div className="text-xs text-[#CFC6B0] mb-2">성별</div>
          <div className="flex gap-2 mb-3">
            <span className="chip chip-남">남 {byGender['남']||0}</span>
            <span className="chip chip-여">여 {byGender['여']||0}</span>
          </div>
          <div className="text-xs text-[#CFC6B0] mb-2">급수</div>

        <h3 className="font-black gold-text mb-3">최근 게임 로그 (최대 100건)</h3>

// =========================================================
// 📸 사진 OCR 시뮬레이션 (v1 강점)
// =========================================================
function PhotoSimView({activeMembers, applyPhotoMembers, showToast}){
  const [step, setStep] = useState('upload'); // upload | preview | recognizing | result
  const [imgUrl, setImgUrl] = useState(null);
  const [progress, setProgress] = useState(0);
  const [statusMsg, setStatusMsg] = useState('');
  const [rawText, setRawText] = useState('');
  const [matched, setMatched] = useState([]);
  const [unmatched, setUnmatched] = useState([]);
  const [showRaw, setShowRaw] = useState(false);
  const fileRef = useRef(null);

  const onFile = (file) => {
    if(!file || !file.type.startsWith('image/')){ showToast('이미지 파일만 가능합니다.'); return; }
    const reader = new FileReader();
    reader.onload = e => { setImgUrl(e.target.result); setStep('preview'); };
    reader.readAsDataURL(file);
  };

  const runOCR = async () => {
    if(!imgUrl) return;
    if(typeof Tesseract === 'undefined'){
      setStatusMsg('OCR 라이브러리 로드 실패 — 네트워크 확인 후 새로고침'); return;
    }
    setStep('recognizing'); setProgress(0); setStatusMsg('OCR 모델 로딩 중… (첫 실행 10~20초)');
    try {
      const result = await Tesseract.recognize(imgUrl, 'kor', {
        logger: m => {
          if(m.status === 'recognizing text'){
            setProgress(Math.round(m.progress * 100));
            setStatusMsg(`텍스트 인식 중…`);
          } else if(m.status){
            setStatusMsg(m.status);
          }
        }
      });
      const text = result.data.text || '';
      setRawText(text);
      const {matched:mm, unmatched:um} = matchTokensToMembers(text, activeMembers);
      setMatched(mm.map(x=>({...x, checked: x.confidence >= 0.75})));
      setUnmatched(um);
      setStep('result');
    } catch(err){
      setStatusMsg(`OCR 실패: ${err.message||err}`);
      setStep('preview');
    }
  };

  const toggleMatch = (idx) => setMatched(arr => arr.map((x,i) => i===idx ? {...x, checked: !x.checked} : x));
  const checkAll = (on) => setMatched(arr => arr.map(x => ({...x, checked: on})));

  const apply = () => {
    const selected = matched.filter(x=>x.checked).map(x=>x.member);
    if(selected.length === 0){ showToast('체크된 회원이 없습니다.'); return; }
    applyPhotoMembers(selected);
    reset();
  };

  const reset = () => {
    setStep('upload'); setImgUrl(null); setProgress(0); setStatusMsg(''); setRawText('');
    setMatched([]); setUnmatched([]); setShowRaw(false);
    if(fileRef.current) fileRef.current.value = '';
  };

  return (
    <div className="space-y-4">
      <div className="glass luxury-shadow rounded-2xl p-4">
        <h3 className="font-black gold-text text-lg mb-1 flex items-center gap-2">{Icon.camera}<span>현재 게임판 사진 → 자동 시뮬레이션</span></h3>
        <p className="text-xs text-[#9CA3B8]">현장 화이트보드/태블릿에 표시된 명단을 사진으로 찍어 업로드하면, 한글 OCR + Levenshtein fuzzy 매칭으로 회원을 자동 식별해 대기열과 빈 코트에 일괄 적용합니다.</p>
      </div>

      {step === 'upload' && (
        <div className="glass luxury-shadow rounded-2xl p-8">
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>onFile(e.target.files[0])}/>
          <div onClick={()=>fileRef.current?.click()}
               onDragOver={e=>{e.preventDefault(); e.currentTarget.classList.add('drop-zone','over');}}
               onDragLeave={e=>e.currentTarget.classList.remove('over')}
               onDrop={e=>{e.preventDefault(); e.currentTarget.classList.remove('over'); onFile(e.dataTransfer.files[0]);}}
               className="cursor-pointer border-2 border-dashed border-amber-500/40 rounded-2xl p-10 text-center hover:bg-amber-500/5 transition-all">
            <div className="flex justify-center mb-3 text-amber-400">{Icon.upload}</div>
            <div className="font-bold text-lg mb-1">사진을 드래그하거나 클릭해 선택</div>
            <div className="text-xs text-[#9CA3B8]">JPG / PNG · 권장: 글씨가 또렷한 정면 촬영<br/>모바일에서는 카메라 직접 촬영 가능</div>
          </div>
          <div className="mt-4 text-xs text-[#9CA3B8] leading-relaxed">
            <b className="gold-text">✓ 처리 흐름</b> · ① 사진 선택 → ② OCR 인식(10~20초) → ③ 119명 명단 fuzzy 매칭 → ④ 신뢰도 표시 후 체크박스로 확정 → ⑤ 대기열 추가 + 빈 코트 자동 배정
          </div>
        </div>
      )}

      {step === 'preview' && (
        <div className="glass luxury-shadow rounded-2xl p-4">
          <img src={imgUrl} alt="" className="max-w-full max-h-[420px] mx-auto rounded-xl border border-amber-500/20"/>
          {statusMsg && <div className="text-center text-sm text-red-400 mt-2">{statusMsg}</div>}
          <div className="flex gap-2 mt-4">
            <button onClick={reset} className="btn-ghost rounded-lg px-4 py-2 flex-1">다른 사진 선택</button>
            <button onClick={runOCR} className="btn-gold rounded-lg px-4 py-2 flex-1 font-bold">🔍 OCR 인식 시작</button>
          </div>
        </div>
      )}

      {step === 'recognizing' && (
        <div className="glass luxury-shadow rounded-2xl p-8 text-center">
          <div className="text-5xl mb-3 animate-pulse">🔍</div>
          <div className="font-bold gold-text mb-3">{statusMsg}</div>
          {progress > 0 && (
            <>
              <div className="w-full bg-[rgba(7,15,28,0.6)] rounded-full h-3 overflow-hidden">
                <div className="h-full btn-gold transition-all" style={{width:`${progress}%`}}></div>
              </div>
              <div className="text-3xl font-black gold-grad mt-2 tabular-nums">{progress}%</div>
            </>
          )}
          <div className="text-xs text-[#9CA3B8] mt-4">한글 OCR 모델은 첫 실행 시 캐시되며, 이후엔 즉시 시작됩니다.</div>
        </div>
      )}

      {step === 'result' && (
        <>
          <div className="glass luxury-shadow rounded-2xl p-4">
            <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
              <h4 className="font-black gold-text">인식 결과 · 매칭 후보 ({matched.length}명)</h4>
              <div className="flex gap-2">
                <button onClick={()=>checkAll(true)} className="btn-ghost rounded-lg px-3 py-1.5 text-xs">모두 선택</button>
                <button onClick={()=>checkAll(false)} className="btn-ghost rounded-lg px-3 py-1.5 text-xs">모두 해제</button>
                <button onClick={()=>setShowRaw(s=>!s)} className="btn-ghost rounded-lg px-3 py-1.5 text-xs">원본 OCR {showRaw?'숨김':'보기'}</button>
              </div>
            </div>
            {showRaw && (
              <pre className="bg-black/40 rounded-lg p-3 text-xs text-[#CFC6B0] mb-3 max-h-[160px] overflow-auto whitespace-pre-wrap">{rawText || '(빈 결과)'}</pre>
            )}
            {matched.length === 0 ? (
              <div className="text-center py-10 text-[#9CA3B8]">
                인식된 회원이 없습니다.<br/>사진을 더 선명하게 다시 촬영해주세요.
              </div>
            ) : (
              <ul className="space-y-2 max-h-[420px] overflow-auto">
                {matched.map((x,i)=>{
                  const conf = Math.round(x.confidence * 100);
                  const confColor = conf >= 85 ? 'text-green-400' : conf >= 70 ? 'gold-text' : 'text-[#9CA3B8]';
                  return (
                    <li key={x.member.no} className="flex items-center gap-3 p-2.5 rounded-xl bg-[rgba(7,15,28,0.45)] border border-amber-500/10">
                      <input type="checkbox" checked={x.checked} onChange={()=>toggleMatch(i)} className="w-5 h-5 accent-amber-400"/>
                      <span className={`chip chip-${x.member.gender}`}>{x.member.gender}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="font-bold">{x.member.name}</span>
                          <span className={`chip chip-${x.member.grade}`}>{x.member.grade}</span>
                          <span className="text-[11px] text-[#9CA3B8]">#{x.member.no} · {x.member.age}세</span>
                        </div>
                        <div className="text-[11px] text-[#9CA3B8] mt-0.5">OCR 인식어: "{x.source}"</div>
                      </div>
                      <div className={`text-xs font-bold ${confColor}`}>신뢰도 {conf}%</div>
                    </li>
                  );
                })}
              </ul>
            )}
            {unmatched.length > 0 && (
              <div className="mt-3 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-[#FDE6A8]">
                ⚠ 명단 매칭 실패 인식어 ({unmatched.length}개): <b>{unmatched.slice(0,15).join(', ')}</b>{unmatched.length>15?'…':''}
              </div>
            )}
          </div>
          <div className="flex gap-2">
            <button onClick={reset} className="btn-ghost rounded-lg px-4 py-3 flex-1">다른 사진 다시 시작</button>
            <button onClick={apply} className="btn-gold rounded-lg px-4 py-3 flex-1 font-black">
              ✓ 선택된 {matched.filter(x=>x.checked).length}명 시뮬레이션 적용
            </button>
          </div>
        </>
      )}
    </div>
  );
}
